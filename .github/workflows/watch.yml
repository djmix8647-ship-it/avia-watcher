name: avia-watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# Не даём двум прогонам работать одновременно над одной и той же prices.db —
# если предыдущий прогон ещё не закончился (например, ещё не наступил 5-минутный
# промежуток целиком), новый просто встаёт в очередь, не запускаясь параллельно.
concurrency:
  group: avia-watcher-run
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # actions/cache: ключ кэша неизменяем после создания, поэтому используем
      # restore (последний доступный prices-db-* по префиксу) + save с уникальным
      # ключом на каждый прогон — так prices.db переживает между запусками,
      # хотя раннер GitHub Actions сам по себе одноразовый (эфемерный).
      - uses: actions/cache/restore@v4
        with:
          path: prices.db
          key: prices-db-${{ github.run_id }}
          restore-keys: |
            prices-db-

      - run: python watcher.py --once
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: prices.db
          key: prices-db-${{ github.run_id }}
